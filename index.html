<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MathJack Desmos Engine</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- D3.js + FunctionPlot (Движок визуализации уровня Desmos) -->
    <script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
    <script src="https://unpkg.com/function-plot@1/dist/function-plot.js"></script>
    
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #1c1c1e);
            --btn-color: var(--tg-theme-button-color, #007aff);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
            user-select: none;
        }

        h3 { margin: 0 0 10px 0; text-align: center; font-size: 18px; }

        .sliders-panel {
            background: var(--card-bg);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
            font-family: monospace;
            font-size: 15px;
        }

        .slider-row input[type=range] {
            flex-grow: 1;
        }

        .slider-val {
            width: 35px;
            font-weight: bold;
            color: var(--btn-color);
        }

        .equations-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }

        .eq-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 10px;
        }

        .eq-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-badge {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        select, input.eq-input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #ffffff;
            color: #000000;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        input.eq-input {
            font-family: monospace;
            font-size: 15px;
        }

        .btn-remove {
            background: none;
            border: none;
            color: #ff3b30;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            margin-left: auto;
        }

        .controls-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 8px;
            background-color: var(--btn-color);
            color: var(--btn-text);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active { opacity: 0.8; }
        .btn-add { background-color: #34c759; }
        .btn-send { background-color: #5856d6; grid-column: span 2; }

        #plot-container {
            width: 100%;
            height: 350px;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <h3>MathJack Grapher 📈</h3>

    <!-- Слайдеры параметров a, b, c -->
    <div class="sliders-panel">
        <div style="font-size: 13px; font-weight: bold; margin-bottom: 4px; opacity: 0.8;">Параметры функции:</div>
        <div class="slider-row">
            <span>a:</span>
            <input type="range" id="slider-a" min="-5" max="5" step="0.2" value="1">
            <span class="slider-val" id="val-a">1</span>
        </div>
        <div class="slider-row">
            <span>b:</span>
            <input type="range" id="slider-b" min="-5" max="5" step="0.2" value="1">
            <span class="slider-val" id="val-b">1</span>
        </div>
        <div class="slider-row">
            <span>c:</span>
            <input type="range" id="slider-c" min="-10" max="10" step="0.5" value="0">
            <span class="slider-val" id="val-c">0</span>
        </div>
    </div>

    <!-- Список формул -->
    <div class="equations-list" id="eqList"></div>

    <div class="controls-panel">
        <button class="btn-add" id="addEqBtn">+ Функция</button>
        <button id="renderBtn">🔄 Обновить</button>
        <button class="btn-send" id="sendDataBtn">📄 Сформировать PDF-отчет</button>
    </div>

    <!-- График Desmos -->
    <div id="plot-container"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const COLORS = ['#007aff', '#ff3b30', '#34c759', '#af52de', '#ff9500', '#5856d6'];

        // Пресеты с поддержкой параметров a, b, c
        const PRESETS = [
            { name: "--- Выберите из списка ---", value: "custom" },
            { name: "Парабола: a*x^2 + b*x + c", value: "a*x^2 + b*x + c" },
            { name: "Синусоида: a*sin(b*x)", value: "a*sin(b*x)" },
            { name: "Косинусоида: a*cos(b*x)", value: "a*cos(b*x)" },
            { name: "Прямая (Линейная): a*x + b", value: "a*x + b" },
            { name: "Кубическая: a*x^3", value: "a*x^3" },
            { name: "Гипербола: a/x", value: "a/x" },
            { name: "Модуль: a*abs(x)", value: "a*abs(x)" },
            { name: "Экспонента: a*exp(b*x)", value: "a*exp(b*x)" }
        ];

        let equations = [
            { id: 1, fn: 'a*x^2 + c', color: COLORS[0] }
        ];

        let scopeParams = { a: 1, b: 1, c: 0 };

        function renderInputs() {
            const container = document.getElementById('eqList');
            container.innerHTML = '';

            equations.forEach((eq, index) => {
                const row = document.createElement('div');
                row.className = 'eq-row';

                const optionsHTML = PRESETS.map(p => 
                    `<option value="${p.value}" ${p.value === eq.fn ? 'selected' : ''}>${p.name}</option>`
                ).join('');

                row.innerHTML = `
                    <div class="eq-header">
                        <div class="color-badge" style="background-color: ${eq.color};"></div>
                        <span style="font-size: 14px; font-weight: bold;">Функция #${index + 1}</span>
                        ${equations.length > 1 ? `<button class="btn-remove" data-index="${index}">✕</button>` : ''}
                    </div>
                    <select class="eq-select" data-index="${index}">
                        ${optionsHTML}
                    </select>
                    <input type="text" class="eq-input" value="${eq.fn}" data-index="${index}" placeholder="Формула...">
                `;
                container.appendChild(row);
            });

            document.querySelectorAll('.eq-select').forEach(select => {
                select.addEventListener('change', (e) => {
                    const idx = e.target.dataset.index;
                    if (e.target.value !== 'custom') {
                        equations[idx].fn = e.target.value;
                        document.querySelectorAll('.eq-input')[idx].value = e.target.value;
                        drawDesmosPlot();
                    }
                });
            });

            document.querySelectorAll('.eq-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const idx = e.target.dataset.index;
                    equations[idx].fn = e.target.value;
                    drawDesmosPlot();
                });
            });

            document.querySelectorAll('.btn-remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = e.target.dataset.index;
                    equations.splice(idx, 1);
                    renderInputs();
                    drawDesmosPlot();
                });
            });
        }

        function drawDesmosPlot() {
            const container = document.getElementById('plot-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            const data = equations.map(eq => ({
                fn: eq.fn.replace(/(\d)(x)/g, '$1*$2'),
                scope: scopeParams, // Привязываем значения слайдеров к графику
                color: eq.color,
                graphType: 'polyline'
            }));

            try {
                functionPlot({
                    target: '#plot-container',
                    width: width,
                    height: height,
                    grid: true,
                    xAxis: { domain: [-6, 6] },
                    yAxis: { domain: [-6, 6] },
                    data: data
                });
            } catch (err) {
                console.error("Ошибка формулы:", err);
            }
        }

        // Подключаем слушатели на слайдеры параметров
        ['a', 'b', 'c'].forEach(param => {
            document.getElementById(`slider-${param}`).addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                document.getElementById(`val-${param}`).innerText = val;
                scopeParams[param] = val;
                drawDesmosPlot(); // Плавная перерисовка графика при ползунке!
            });
        });

        document.getElementById('addEqBtn').addEventListener('click', () => {
            if (equations.length < 5) {
                const newColor = COLORS[equations.length % COLORS.length];
                equations.push({ id: Date.now(), fn: 'a*sin(b*x)', color: newColor });
                renderInputs();
                drawDesmosPlot();
            }
        });

        document.getElementById('renderBtn').addEventListener('click', drawDesmosPlot);

        // Отправка данных боту с подстановкой реальных чисел вместо a, b, c
        document.getElementById('sendDataBtn').addEventListener('click', () => {
            const evaluatedEqs = equations.map(e => {
                let expr = e.fn;
                expr = expr.replace(/\ba\b/g, scopeParams.a);
                expr = expr.replace(/\bb\b/g, scopeParams.b);
                expr = expr.replace(/\bc\b/g, scopeParams.c);
                return expr;
            }).filter(fn => fn.trim() !== '');

            tg.sendData(JSON.stringify({ 
                expressions: evaluatedEqs,
                type: 'pdf_report'
            }));
        });

        window.onload = () => {
            renderInputs();
            drawDesmosPlot();
        };

        window.addEventListener('resize', drawDesmosPlot);
    </script>
</body>
</html>
